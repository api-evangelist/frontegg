aid: frontegg
name: Frontegg
description: 'Frontegg is a customer identity and access management (CIAM) platform for B2B SaaS. It provides
  self-serve authentication,

  multi-tenancy, role-based access control, single sign-on, SCIM provisioning, entitlements, and an admin
  portal that ships

  with the product. Frontegg publishes OpenAPI specifications for its Authentication and Identity, Account
  Management,

  Single Sign-On, SCIM Provisioning, Applications, Audits, Entitlements, Entitlements Agent (PDP), and
  Environment

  Authentication APIs, all served from regional gateway endpoints (api.frontegg.com, api.us.frontegg.com,
  api.au.frontegg.com,

  api.ca.frontegg.com).

  '
