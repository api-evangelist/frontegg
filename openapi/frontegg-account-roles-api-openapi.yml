tags:
- name: Account roles
  x-displayName: Account roles
paths:
  /resources/roles/v2:
    get:
      operationId: PermissionsControllerV2_getAllRoles
      summary: Get roles v2
      description: This route returns all roles for vendor. Each role is an object containing the name, permissions, and other defining information.
      parameters:
      - name: _limit
        required: false
        in: query
        schema:
          minimum: 1
          maximum: 2000
          default: 50
          type: number
      - name: _sortBy
        required: true
        in: query
        schema:
          enum:
          - key
          - name
          - description
          - isDefault
          - firstUserRole
          - level
          - updatedAt
          - createdAt
          - permissions
          - userTenants
          - groups
          type: string
      - name: _levels
        required: false
        in: query
        schema:
          type: array
          items:
            type: number
      - name: _tenantIds
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
      - name: _offset
        required: false
        in: query
        schema:
          minimum: 0
          default: 0
          type: number
      - name: _order
        required: false
        in: query
        schema:
          enum:
          - ASC
          - DESC
          type: string
      - name: _filter
        required: false
        in: query
        schema:
          type: string
      - name: frontegg-tenant-id
        in: header
        description: For relating a role to a specific tenant, use `get tenants` API to find the tenant ids
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleResponse'
      tags:
      - Account roles
      security:
      - bearer: []
    post:
      operationId: RolesControllerV2_addRole
      summary: Create a new role
      description: This route adds a new role for a specific tenant. Send the tenant ID in the **`frontegg-tenant-id`** header. Add the required permissions within the request body to customize the role.
      parameters:
      - name: frontegg-tenant-id
        in: header
        description: For relating a role to a specific tenant, use `get tenants` API to find the tenant ids
        required: false
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRoleWithPermissionsRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddRoleWithPermissionsResponse'
      tags:
      - Account roles
      security:
      - bearer: []
  /resources/roles/v2/distinct-levels:
    get:
      operationId: RolesControllerV2_getDistinctLevels
      summary: Get distinct levels of roles
      description: This route returns all levels from roles for vendor.
      parameters:
      - name: frontegg-tenant-id
        in: header
        description: For relating a role to a specific tenant, use `get tenants` API to find the tenant ids
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Account roles
      security:
      - bearer: []
  /resources/roles/v2/distinct-tenants:
    get:
      operationId: RolesControllerV2_getDistinctTenants
      summary: Get distinct assigned tenants of roles
      description: This route returns all assigned tenant ids from roles for vendor.
      parameters:
      - name: frontegg-tenant-id
        in: header
        description: For relating a role to a specific tenant, use `get tenants` API to find the tenant ids
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Account roles
      security:
      - bearer: []
components:
  schemas:
    AddRoleWithPermissionsRequest:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
          description: This role will be assigned for every user that will be added without specified roles
        baseRoleId:
          type: string
          description: Role level of the new role will be based on this parameter
        permissionIds:
          type: array
          items:
            type: string
      required:
      - key
      - name
      - baseRoleId
      - permissionIds
    RoleResponse:
      type: object
      properties:
        id:
          type: string
        vendorId:
          type: string
        tenantId:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        firstUserRole:
          type: boolean
        level:
          type: number
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        permissions:
          type: array
          items:
            type: string
      required:
      - id
      - vendorId
      - tenantId
      - key
      - name
      - description
      - isDefault
      - firstUserRole
      - level
      - createdAt
      - updatedAt
      - permissions
    AddRoleWithPermissionsResponse:
      type: object
      properties:
        id:
          type: string
        vendorId:
          type: string
        tenantId:
          type: string
        key:
          type: string
        name:
          type: string
        description:
          type: string
        isDefault:
          type: boolean
        permissions:
          type: array
          items:
            type: string
      required:
      - id
      - vendorId
      - tenantId
      - key
      - name
      - description
      - isDefault
      - permissions
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
