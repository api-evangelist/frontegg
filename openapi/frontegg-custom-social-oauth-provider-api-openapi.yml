tags:
- name: Custom social OAuth provider
  x-displayName: Custom social OAuth provider
paths:
  /resources/sso/custom/v1:
    post:
      operationId: CustomSsoV1Controller_createSsoProvider
      summary: Create custom oauth provider
      description: This route creates a custom social login provider using OAuth details of the identity provider
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomSsoRequestDto'
      responses:
        '200':
          description: ''
      tags:
      - Custom social OAuth provider
      security:
      - bearer: []
    get:
      operationId: SsoV2Controller_getSsoProviders
      summary: Get custom oauth provider
      description: This route fetches the custom social login providers on an environment
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - Custom social OAuth provider
      security:
      - bearer: []
  /resources/sso/custom/v1/{id}:
    patch:
      operationId: CustomSsoV1Controller_updateSsoProvider
      summary: Update custom oauth provider
      description: This route updates the custom social login provider on an environment by ID
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomSsoRequestDto'
      responses:
        '200':
          description: ''
      tags:
      - Custom social OAuth provider
      security:
      - bearer: []
    delete:
      operationId: CustomSsoV1Controller_deleteCustomSsoConfig
      summary: Delete custom oauth provider
      description: This route deletes the custom social login provider on an environment by ID
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Custom social OAuth provider
      security:
      - bearer: []
components:
  schemas:
    CreateCustomSsoRequestDto:
      type: object
      properties:
        type:
          type: string
        clientId:
          type: string
        secret:
          type: string
        redirectUrl:
          type: string
        authorizationUrl:
          type: string
        tokenUrl:
          type: string
        userInfoUrl:
          type: string
        scopes:
          type: string
        ssoLogoUrl:
          type: string
        displayName:
          type: string
        active:
          type: boolean
      required:
      - type
      - clientId
      - secret
      - redirectUrl
      - authorizationUrl
      - tokenUrl
      - userInfoUrl
      - scopes
      - ssoLogoUrl
      - displayName
      - active
    UpdateCustomSsoRequestDto:
      type: object
      properties:
        type:
          type: string
        clientId:
          type: string
        secret:
          type: string
        redirectUrl:
          type: string
        authorizationUrl:
          type: string
        tokenUrl:
          type: string
        userInfoUrl:
          type: string
        scopes:
          type: string
        ssoLogoUrl:
          type: string
        displayName:
          type: string
        active:
          type: boolean
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
