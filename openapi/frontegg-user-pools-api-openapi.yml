    - url: https://api.au.frontegg.com/identity
      description: AU Region
    - url: https://{domain}.frontegg.com/identity
      description: Frontegg sub-domain for use with user tokens
      variables:
        domain:
          default: app-xxx
    get:
      operationId: UserSourcesControllerV1_getUserSource
      summary: Get Vendor User Source
      description: 'Retrieve a user source by ID.


        A valid environment token is required to call this endpoint.'
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserSourceResponseDTO'
      tags:
      - User Pools
      security:
      - bearer: []
    delete:
      operationId: UserSourcesControllerV1_deleteUserSource
      summary: Delete User Source
      description: 'Delete a user source.


        A valid environment token is required to call this endpoint.'
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - User Pools
      security:
      - bearer: []
  /resources/user-sources/v1/external/auth0:
    servers:
    - url: https://api.frontegg.com/identity
