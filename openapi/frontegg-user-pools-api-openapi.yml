      operationId: UserSourcesControllerV1_getUserSourceUsers
      summary: Get User Source Users
      description: 'Retrieve all users of a user source.


        A valid environment token is required to call this endpoint.'
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FronteggPaginationWrapper'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/GetUserSourceUsersResponseDTO'
                    _links:
                      $ref: '#/components/schemas/FronteggPaginationLinks'
                    _metadata:
                      $ref: '#/components/schemas/FronteggPaginationMetadata'
      tags:
      - User Pools
      security:
      - bearer: []
components:
  schemas:
    FirebaseServiceAccountConfig:
      type: object
      properties:
        type:
          type: string
        project_id:
          type: string
        private_key_id:
          type: string
        private_key:
          type: string
        client_email:
          type: string
        client_id:
          type: string
        auth_uri:
          type: string
        token_uri:
          type: string
        auth_provider_x509_cert_url:
          type: string
        client_x509_cert_url:
          type: string
        universe_domain:
          type: string
      required:
      - type
      - project_id
      - private_key_id
      - private_key
      - client_email
      - client_id
      - auth_uri
      - token_uri
      - auth_provider_x509_cert_url
      - client_x509_cert_url
      - universe_domain
    FronteggPaginationMetadata:
      type: object
      properties:
        totalItems:
          type: number
        totalPages:
          type: number
      required:
      - totalItems
      - totalPages
    UserSourceFromSourceTenantConfig:
      type: object
      properties:
        tenantResolverType:
          type: string
          enum:
          - from-source
      required:
      - tenantResolverType
    UserSourceStaticTenantConfig:
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant id which all of the users would be added to
        tenantResolverType:
          type: string
          enum:
          - static
      required:
      - tenantId
      - tenantResolverType
    GetUserSourceUsersResponseDTO:
      type: object
      properties:
        email:
          type: string
        lastLogin:
          format: date-time
          type: string
      required:
      - email
      - lastLogin
    ExternalAuth0UserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        isMigrated:
          type: boolean
          description: Whether to migrate the users
        domain:
          type: string
          description: the auth0 domain
        clientId:
          type: string
          description: the auth0 application clientId
        secret:
          type: string
          description: the auth0 application secret
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceDynamicTenantConfig'
          - $ref: '#/components/schemas/UserSourceStaticTenantConfig'
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
      required:
      - syncOnLogin
      - isMigrated
      - domain
      - clientId
      - secret
      - tenantConfig
    CreateCustomCodeExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalCustomCodeUserSourceConfig'
        appIds:
          description: The application Ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    CreateAuth0ExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalAuth0UserSourceConfig'
        appIds:
          description: The application Ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    CreateUserSourceResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        appIds:
          type: array
          items:
            type: string
        description:
          type: string
        index:
          type: number
      required:
      - id
      - name
      - type
      - appIds
      - description
      - index
    AssignApplicationsToUserSourceRequestDTO:
      type: object
      properties:
        appIds:
          description: The application Ids to assign to this user source
          type: array
          items:
            type: string
        userSourceId:
          type: string
          description: The user source id
      required:
      - appIds
      - userSourceId
    CreateCognitoExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalCognitoUserSourceConfig'
        appIds:
          description: The application Ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    ExternalFirebaseUserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        isMigrated:
          type: boolean
          description: Whether to migrate the users
        apiKey:
          type: string
          description: The firebase Web API Key
        serviceAccount:
          $ref: '#/components/schemas/FirebaseServiceAccountConfig'
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceStaticTenantConfig'
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
      required:
      - syncOnLogin
      - isMigrated
      - apiKey
      - serviceAccount
      - tenantConfig
    CreateFirebaseExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalFirebaseUserSourceConfig'
        appIds:
          description: The application Ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    FronteggPaginationLinks:
      type: object
      properties:
        next:
          type: string
        prev:
          type: string
        first:
          type: string
        last:
          type: string
      required:
      - next
      - prev
      - first
      - last
    Oauth2UserSourceConfig:
      type: object
      properties:
        authorizationUrl:
          type: string
          description: The authorization URL of the OAuth2 provider
        tokenUrl:
          type: string
          description: The token URL of the OAuth2 provider
        userInfoUrl:
          type: string
          description: The user info URL of the OAuth2 provider
        scopes:
          description: The scopes to request from the OAuth2 provider
          example:
          - openid
          - email
          - profile
          type: array
          items:
