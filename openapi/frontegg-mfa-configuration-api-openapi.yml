tags:
- name: MFA configuration
  x-displayName: MFA configuration
paths:
  /resources/configurations/v1/mfa:
    post:
      operationId: MfaController_upsertMfaConfig
      summary: Update MFA configuration
      description: This route updates the MFA configuration for a vendor. Send values in the POST body as objects for params that you want to add or update. See the dropdowns for available values for each object param.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaConfigRequest'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaConfigResponse'
      tags:
      - MFA configuration
      security:
      - bearer: []
    get:
      operationId: MfaController_getMfaConfig
      summary: Get MFA configuration
      description: This route gets the MFA configuration for a vendor.
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaConfigResponse'
      tags:
      - MFA configuration
      security:
      - bearer: []
components:
  schemas:
    MfaEmailConfig:
      type: object
      properties:
        active:
          type: boolean
        tokenLifetimeSeconds:
          type: number
          minimum: 300
        sender:
          type: string
      required:
      - active
      - tokenLifetimeSeconds
      - sender
    EmailConfiguration:
      type: object
      properties:
        active:
          type: boolean
        tokenLifetimeSeconds:
          type: number
        sender:
          type: string
      required:
      - active
      - tokenLifetimeSeconds
      - sender
    MfaSmsConfig:
      type: object
      properties:
        active:
          type: boolean
        tokenLifetimeSeconds:
          type: number
          minimum: 300
      required:
      - active
      - tokenLifetimeSeconds
    MfaConfigRequest:
      type: object
      properties:
        authenticationApp:
          $ref: '#/components/schemas/MfaAuthAppConfig'
        sms:
          $ref: '#/components/schemas/MfaSmsConfig'
        email:
          $ref: '#/components/schemas/MfaEmailConfig'
    AuthenticationAppConfiguration:
      type: object
      properties:
        active:
          type: boolean
        serviceName:
          type: string
      required:
      - active
      - serviceName
    MfaAuthAppConfig:
      type: object
      properties:
        active:
          type: boolean
        serviceName:
          type: string
      required:
      - active
      - serviceName
    SmsConfiguration:
      type: object
      properties:
        active:
          type: boolean
        tokenLifetimeSeconds:
          type: number
      required:
      - active
      - tokenLifetimeSeconds
    MfaConfigResponse:
      type: object
      properties:
        authenticationApp:
          $ref: '#/components/schemas/AuthenticationAppConfiguration'
        sms:
          $ref: '#/components/schemas/SmsConfiguration'
        email:
          $ref: '#/components/schemas/EmailConfiguration'
      required:
      - authenticationApp
      - sms
      - email
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
