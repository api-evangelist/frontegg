openapi: 3.2.0
info:
  title: Entitlements Agent (PDP) User sources (pools) API
  description: ''
  version: ''
  contact: {}
servers:
- url: http://{host}:{port}
  variables:
    host:
      default: localhost
    port:
      default: '8181'
- url: https://{domain}.frontegg.com/entitlements
  variables:
    domain:
      default: api
- url: https://api.frontegg.com/auth/vendor
  description: EU Region
- url: https://api.us.frontegg.com/auth/vendor
  description: US Region
- url: https://api.ca.frontegg.com/auth/vendor
  description: CA Region
- url: https://api.au.frontegg.com/auth/vendor
  description: AU Region
  variables:
    domain:
      default: app-xxxx
- url: https://api.frontegg.com/identity
  description: EU Region
- url: https://api.us.frontegg.com/identity
  description: US Region
- url: https://api.ca.frontegg.com/identity
  description: CA Region
- url: https://api.au.frontegg.com/identity
  description: AU Region
- url: https://{domain}.frontegg.com/identity
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxx
- url: https://api.frontegg.com/directory
  description: EU Region
- url: https://api.us.frontegg.com/directory
  description: US Region
- url: https://api.ca.frontegg.com/directory
  description: CA Region
- url: https://api.au.frontegg.com/directory
  description: AU Region
- url: https://{domain}.frontegg.com/directory
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxx
- url: https://api.frontegg.com/team
  description: EU Region
- url: https://api.us.frontegg.com/team
  description: US Region
- url: https://api.ca.frontegg.com/team
  description: CA Region
- url: https://api.au.frontegg.com/team
  description: AU Region
- url: https://{domain}.frontegg.com/team
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxx
- url: https://api.frontegg.com/tenants
  description: EU Region
- url: https://api.us.frontegg.com/tenants
  description: US Region
- url: https://api.ca.frontegg.com/tenants
  description: CA Region
- url: https://api.au.frontegg.com/tenants
  description: AU Region
- url: https://{domain}.frontegg.com/tenants
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxxx
tags:
- name: User sources (pools)
  x-displayName: User sources (pools)
paths:
  /resources/user-sources/v1:
    get:
      operationId: UserSourcesControllerV1_getUserSources
      summary: Get vendor user sources
      description: This route gets all vendor's user sources. A vendor token is required for this route.
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetUserSourceExtendedResponseDTO'
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/{id}:
    get:
      operationId: UserSourcesControllerV1_getUserSource
      summary: Get vendor user source
      description: This route gets a user source by id. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserSourceResponseDTO'
      tags:
      - User sources (pools)
      security:
      - bearer: []
    delete:
      operationId: UserSourcesControllerV1_deleteUserSource
      summary: Delete user source
      description: This route deletes a user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/auth0:
    post:
      operationId: UserSourcesControllerV1_createAuth0ExternalUserSource
      summary: Create Auth0 external user source
      description: This route creates a new external user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAuth0ExternalUserSourceRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSourceResponse'
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/cognito:
    post:
      operationId: UserSourcesControllerV1_createCognitoExternalUserSource
      summary: Create Cognito external user source
      description: This route creates a new external user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCognitoExternalUserSourceRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSourceResponse'
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/firebase:
    post:
      operationId: UserSourcesControllerV1_createFirebaseExternalUserSource
      summary: Create Firebase external user source
      description: This route creates a new external user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFirebaseExternalUserSourceRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSourceResponse'
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/custom-code:
    post:
      operationId: UserSourcesControllerV1_createCustomCodeExternalUserSource
      summary: Create Custom-Code external user source
      description: This route creates a new external user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomCodeExternalUserSourceRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSourceResponse'
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/federation:
    post:
      operationId: UserSourcesControllerV1_createFederationUserSource
      summary: Create Federation user source
      description: This route creates a new federation user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFederationUserSourceRequestDTO'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserSourceResponse'
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/auth0/{id}:
    put:
      operationId: UserSourcesControllerV1_updateAuth0ExternalUserSource
      summary: Update Auth0 external user source
      description: This route updates an external user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalAuth0UserSourceRequestDTO'
      responses:
        '200':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/cognito/{id}:
    put:
      operationId: UserSourcesControllerV1_updateCognitoExternalUserSource
      summary: Update Cognito external user source
      description: This route updates an external user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalCognitoUserSourceRequestDTO'
      responses:
        '200':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/firebase/{id}:
    put:
      operationId: UserSourcesControllerV1_updateFirebaseExternalUserSource
      summary: Update Firebase external user source
      description: This route updates an external user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalFirebaseUserSourceRequestDTO'
      responses:
        '200':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/external/custom-code/{id}:
    put:
      operationId: UserSourcesControllerV1_updateCustomCodeExternalUserSource
      summary: Update Custom-Code external user source
      description: This route updates an external user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExternalCustomCodeUserSourceRequestDTO'
      responses:
        '200':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/federation/{id}:
    put:
      operationId: UserSourcesControllerV1_updateFederationUserSource
      summary: Update Federation user source
      description: This route updates a federation user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFederationUserSourceRequestDTO'
      responses:
        '200':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/assign:
    post:
      operationId: UserSourcesControllerV1_assignUserSource
      summary: Assign applications to a user source
      description: This route assigns applications to a user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignApplicationsToUserSourceRequestDTO'
      responses:
        '201':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/unassign:
    post:
      operationId: UserSourcesControllerV1_unassignUserSource
      summary: Unassign applications from a user source
      description: This route unassigns applications from a user source. A vendor token is required for this route.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnassignApplicationsFromUserSourceRequestDTO'
      responses:
        '201':
          description: ''
      tags:
      - User sources (pools)
      security:
      - bearer: []
  /resources/user-sources/v1/{id}/users:
    get:
      operationId: UserSourcesControllerV1_getUserSourceUsers
      summary: Get user source users
      description: This route gets all of users of a user source. A vendor token is required for this route.
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetUserSourceUsersResponseDTO'
      tags:
      - User sources (pools)
      security:
      - bearer: []
components:
  schemas:
    CreateCustomCodeExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalCustomCodeUserSourceConfig'
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    UpdateExternalFirebaseUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalFirebaseUserSourceConfig'
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
    ExternalFirebaseUserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        isMigrated:
          type: boolean
          description: Whether to migrate the users
        apiKey:
          type: string
          description: The firebase Web API Key
        serviceAccount:
          $ref: '#/components/schemas/FirebaseServiceAccountConfig'
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceStaticTenantConfig'
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
      required:
      - syncOnLogin
      - isMigrated
      - apiKey
      - serviceAccount
      - tenantConfig
    UpdateFederationUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/FederationUserSourceConfig'
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
    UpdateExternalAuth0UserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalAuth0UserSourceConfig'
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
    FirebaseServiceAccountConfig:
      type: object
      properties:
        type:
          type: string
        project_id:
          type: string
        private_key_id:
          type: string
        private_key:
          type: string
        client_email:
          type: string
        client_id:
          type: string
        auth_uri:
          type: string
        token_uri:
          type: string
        auth_provider_x509_cert_url:
          type: string
        client_x509_cert_url:
          type: string
        universe_domain:
          type: string
      required:
      - type
      - project_id
      - private_key_id
      - private_key
      - client_email
      - client_id
      - auth_uri
      - token_uri
      - auth_provider_x509_cert_url
      - client_x509_cert_url
      - universe_domain
    CreateCognitoExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalCognitoUserSourceConfig'
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    UpdateExternalCognitoUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalCognitoUserSourceConfig'
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
    CreateUserSourceResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        appIds:
          type: array
          items:
            type: string
        description:
          type: string
        index:
          type: number
      required:
      - id
      - name
      - type
      - appIds
      - description
      - index
    AssignApplicationsToUserSourceRequestDTO:
      type: object
      properties:
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        userSourceId:
          type: string
          description: The user source id
      required:
      - appIds
      - userSourceId
    UnassignApplicationsFromUserSourceRequestDTO:
      type: object
      properties:
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        userSourceId:
          type: string
          description: The user source id
      required:
      - appIds
      - userSourceId
    UpdateExternalCustomCodeUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalCustomCodeUserSourceConfig'
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
    ExternalCognitoUserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        isMigrated:
          type: boolean
          description: Whether to migrate the users
        region:
          type: string
          description: The aws region of the cognito user pool
        clientId:
          type: string
          description: The cognito app client id
        userPoolId:
          type: string
          description: The id of the cognito user pool
        accessKeyId:
          type: string
          description: The access key of the aws account
        secretAccessKey:
          type: string
          description: The secret of the aws account
        clientSecret:
          type: string
          description: The cognito application client secret, required if the app client is configured with a client secret
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceDynamicTenantConfig'
          - $ref: '#/components/schemas/UserSourceStaticTenantConfig'
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
      required:
      - syncOnLogin
      - isMigrated
      - region
      - clientId
      - userPoolId
      - accessKeyId
      - secretAccessKey
      - tenantConfig
    ExternalCustomCodeUserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        isMigrated:
          type: boolean
          description: Whether to migrate the users
        codePayload:
          type: string
        getUserCodePayload:
          type: string
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
          - $ref: '#/components/schemas/UserSourceFromSourceTenantConfig'
      required:
      - syncOnLogin
      - isMigrated
      - codePayload
      - tenantConfig
    UserSourceDynamicTenantConfig:
      type: object
      properties:
        tenantIdFieldName:
          type: string
          description: The attribute name of which the tenant id would be taken from
        tenantResolverType:
          type: string
          enum:
          - dynamic
      required:
      - tenantIdFieldName
      - tenantResolverType
    GetUserSourceUsersResponseDTO:
      type: object
      properties:
        email:
          type: string
        lastLogin:
          format: date-time
          type: string
      required:
      - email
      - lastLogin
    CreateFirebaseExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalFirebaseUserSourceConfig'
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    CreateFederationUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/FederationUserSourceConfig'
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    GetUserSourceExtendedResponseDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        appIds:
          type: array
          items:
            type: string
        index:
          type: number
        configuration:
          type: object
        usersCount:
          type: number
      required:
      - id
      - name
      - type
      - description
      - appIds
      - index
      - configuration
      - usersCount
    UserSourceFromSourceTenantConfig:
      type: object
      properties:
        tenantResolverType:
          type: string
          enum:
          - from-source
      required:
      - tenantResolverType
    UserSourceNewTenantConfig:
      type: object
      properties:
        tenantResolverType:
          type: string
          enum:
          - new
      required:
      - tenantResolverType
    CreateAuth0ExternalUserSourceRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: The user source name
        configuration:
          description: User source configuration
          allOf:
          - $ref: '#/components/schemas/ExternalAuth0UserSourceConfig'
        appIds:
          description: The application ids to assign to this user source
          type: array
          items:
            type: string
        index:
          type: number
          description: The user source index
        description:
          type: string
          description: The user source description
      required:
      - name
      - configuration
      - index
    GetUserSourceResponseDTO:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        appIds:
          type: array
          items:
            type: string
        index:
          type: number
        configuration:
          type: object
      required:
      - id
      - name
      - type
      - description
      - appIds
      - index
      - configuration
    UserSourceStaticTenantConfig:
      type: object
      properties:
        tenantId:
          type: string
          description: The tenant id which all of the users would be added to
        tenantResolverType:
          type: string
          enum:
          - static
      required:
      - tenantId
      - tenantResolverType
    FederationUserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        wellknownUrl:
          type: string
          description: The url of the service provider
        clientId:
          type: string
          description: The client id from the service provider
        secret:
          type: string
          description: The secret from the service provider
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceDynamicTenantConfig'
          - $ref: '#/components/schemas/UserSourceStaticTenantConfig'
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
      required:
      - syncOnLogin
      - wellknownUrl
      - clientId
      - secret
      - tenantConfig
    ExternalAuth0UserSourceConfig:
      type: object
      properties:
        syncOnLogin:
          type: boolean
          description: Whether to sync user profile attributes on each login
        isMigrated:
          type: boolean
          description: Whether to migrate the users
        domain:
          type: string
          description: the auth0 domain
        clientId:
          type: string
          description: the auth0 application clientId
        secret:
          type: string
          description: the auth0 application secret
        tenantConfig:
          oneOf:
          - $ref: '#/components/schemas/UserSourceDynamicTenantConfig'
          - $ref: '#/components/schemas/UserSourceStaticTenantConfig'
          - $ref: '#/components/schemas/UserSourceNewTenantConfig'
      required:
      - syncOnLogin
      - isMigrated
      - domain
      - clientId
      - secret
      - tenantConfig
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
x-tagGroups:
- name: Entitlements Agent (PDP)
  tags:
  - Entitlements Check
- name: Entitlements Service
  tags:
