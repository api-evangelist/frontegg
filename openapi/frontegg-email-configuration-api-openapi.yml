- url: https://api.us.frontegg.com/auth/vendor
  description: US Region
- url: https://api.ca.frontegg.com/auth/vendor
  description: CA Region
- url: https://api.au.frontegg.com/auth/vendor
  description: AU Region
  variables:
    domain:
      default: app-xxxx
- url: https://api.frontegg.com/identity
  description: EU Region
- url: https://api.us.frontegg.com/identity
  description: US Region
- url: https://api.ca.frontegg.com/identity
  description: CA Region
- url: https://api.au.frontegg.com/identity
  description: AU Region
- url: https://{domain}.frontegg.com/identity
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxx
- url: https://api.frontegg.com/directory
  description: EU Region
- url: https://api.us.frontegg.com/directory
  description: US Region
- url: https://api.ca.frontegg.com/directory
  description: CA Region
- url: https://api.au.frontegg.com/directory
  description: AU Region
- url: https://{domain}.frontegg.com/directory
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxx
- url: https://api.frontegg.com/team
  description: EU Region
- url: https://api.us.frontegg.com/team
  description: US Region
- url: https://api.ca.frontegg.com/team
  description: CA Region
- url: https://api.au.frontegg.com/team
  description: AU Region
- url: https://{domain}.frontegg.com/team
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxx
- url: https://api.frontegg.com/tenants
  description: EU Region
- url: https://api.us.frontegg.com/tenants
  description: US Region
- url: https://api.ca.frontegg.com/tenants
  description: CA Region
- url: https://api.au.frontegg.com/tenants
  description: AU Region
- url: https://{domain}.frontegg.com/tenants
  description: Frontegg sub-domain for use with user tokens
  variables:
    domain:
      default: app-xxxx
tags:
- name: Email configuration
  x-displayName: Email configuration
paths:
  /resources/mail/v1/configurations:
    post:
      operationId: MailConfigController_createOrUpdateMailConfig
      summary: Create or update configuration
      description: Frontegg sends emails via SendGrid. If you already have an account on SendGrid and you wish emails to be sent from your SendGrid account, pass the SendGrid secret key as a body param. A vendor token is required for this route, it can be obtained from the vendor authentication route.
      deprecated: true
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrUpdateMailConfigRequestDto'
      responses:
        '200':
          description: ''
        '201':
          description: ''
      tags:
      - Email configuration
      security:
      - bearer: []
    get:
      operationId: MailConfigController_getMailConfig
      summary: Get configuration
      description: This route returns the mail configuration setup on Frontegg for your SendGrid account. A vendor token is required for this route, it can be obtained from the vendor authentication route.
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMailConfigResponseDto'
      tags:
      - Email configuration
      security:
      - bearer: []
    delete:
      operationId: MailConfigController_deleteMailConfig
      summary: Delete configuration
      description: A vendor token is required for this route, it can be obtained from the vendor authentication route.
      parameters: []
      responses:
        '200':
          description: ''
      tags:
      - Email configuration
      security:
      - bearer: []
  /resources/mail/v2/configurations:
    post:
      operationId: MailConfigController_createOrUpdateMailConfigV2
      summary: Create or update configuration v2
      description: Configure and manage email settings with our controller, supporting SES, Mailgun, and SendGrid. Easily set the email provider and sender details, include additional parameters as needed, and send configuration data via POST. A vendor token from the authentication route is required.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  oneOf:
                  - $ref: '#/components/schemas/SendGridDto'
                  - $ref: '#/components/schemas/SesDto'
                  - $ref: '#/components/schemas/MailgunDto'
                  - $ref: '#/components/schemas/SesRoleDto'
      responses:
        '201':
          description: ''
      tags:
      - Email configuration
      security:
      - bearer: []
components:
  schemas:
    SesRoleDto:
      type: object
      properties:
        provider:
          type: string
          enum:
          - ses-role
        secret:
          type: string
        region:
          type: string
      required:
      - provider
      - secret
      - region
    SesDto:
      type: object
      properties:
        provider:
          type: string
          enum:
          - ses
        secret:
          type: string
        id:
          type: string
        region:
          type: string
      required:
      - provider
      - secret
      - id
      - region
    CreateOrUpdateMailConfigRequestDto:
      type: object
      properties:
        secret:
          type: string
      required:
      - secret
    SendGridDto:
      type: object
      properties:
        provider:
          type: string
          enum:
          - sendgrid
        secret:
          type: string
      required:
      - provider
      - secret
    GetMailConfigResponseDto:
      type: object
      properties:
        secret:
          type: string
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        extension:
          type: array
          items:
            type: object
        provider:
          type: string
          enum:
          - sendgrid
          - mailgun
          - ses
          - ses-role
      required:
      - secret
      - createdAt
      - updatedAt
      - extension
      - provider
    MailgunDto:
      type: object
      properties:
        provider:
          type: string
          enum:
          - mailgun
        secret:
          type: string
        domain:
          type: string
        region:
          default: us
          enum:
          - US: us
            EU: eu
          type: number
      required:
      - provider
      - secret
      - domain
      - region
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
