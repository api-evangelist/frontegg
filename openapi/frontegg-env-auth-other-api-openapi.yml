tags:
- name: env-auth_other
  x-displayName: other
paths:
  /:
    post:
      operationId: authenticate_vendor
      summary: Authenticate with env credentials
      description: Authenticate your environment to get a management token for your environment using the `clientId` and `API key`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorAuthenticationRequest'
      responses:
        '200':
          description: Authentication succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorAuthenticationResponse'
        '401':
          description: Invalid authentication
      tags:
      - env-auth_other
components:
  schemas:
    VendorAuthenticationRequest:
      type: object
      required:
      - clientId
      - secret
      properties:
        clientId:
          type: string
        secret:
          type: string
    VendorAuthenticationResponse:
      type: object
      properties:
        token:
          type: string
        expiresIn:
          type: number
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
