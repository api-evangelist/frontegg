  /resources/users/v3:
    servers:
    - url: https://api.frontegg.com/identity
      description: EU Region
    - url: https://api.us.frontegg.com/identity
      description: US Region
    - url: https://api.ca.frontegg.com/identity
      description: CA Region
    - url: https://api.au.frontegg.com/identity
      description: AU Region
    - url: https://{domain}.frontegg.com/identity
      description: Frontegg sub-domain for use with user tokens
      variables:
        domain:
          default: app-xxx
    get:
      operationId: UsersControllerV3_getUsers
      summary: Get Users
      description: Retrieve all users for an account (tenant) or for the entire environment.
      parameters:
      - name: _limit
        required: false
        in: query
        description: The default limit is 50 users per request, the maximum is 200
        schema:
          type: number
      - name: _identifier
        required: false
        in: query
        description: Filter users by username prefix match. Must be provided together with _identifierType
        schema:
          type: string
      - name: _identifierType
        required: false
        in: query
        description: Filter users by username. Must be provided together with _identifier
        schema:
          enum:
          - email
          - phoneNumber
          - username
          type: string
      - name: _includeSubTenants
        required: false
        in: query
        description: when passing a user id, gives the option to include or not include sub accounts (tenants) when searching users
        schema:
          default: true
          type: boolean
      - name: _namePrefix
        required: false
        in: query
        description: Filter users by prefix name match
        schema:
          type: string
      - name: _offset
        required: false
        in: query
        schema:
          minimum: 0
          type: number
        description: The page number to retrieve. For example, use 0 for the first page, 1 for the second page.
      - name: _email
        required: false
        in: query
        schema:
          type: string
      - name: _tenantId
        required: false
        in: query
        schema:
          type: string
      - name: ids
        required: false
        in: query
        schema:
          type: string
      - name: _sortBy
        required: false
        in: query
        schema:
          enum:
          - createdAt
          - name
          - email
          - id
          - verified
          - isLocked
          - provider
          - tenantId
          type: string
      - name: _order
        required: false
        in: query
        schema:
          enum:
          - ASC
          - DESC
          type: string
      - name: _externalIds
        required: false
        in: query
