components:
  schemas:
    CreateUsernameRequestDto:
      type: object
      properties:
        username:
          type: string
          description: 'The username to create. Allowed characters: alphanumeric (a-z, 0-9), ^, $, ., !, -, #, +, '', ~, _ (no spaces, no accents, automatically converted to lowercase). Max length: 128 characters.'
          example: john.doe$!#-+'~_
      required:
      - username
    CreateUserEmailRequestDto:
      type: object
      properties:
        email:
          type: string
          description: New email
      required:
      - email
    CreateUserDto:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email of the user. If not provided, the username is required
        username:
          type: string
          maxLength: 255
          pattern: /^[a-zA-Z0-9._-]+$/
          description: The username of the user. If not provided, the email is required. Maximum length is 255 characters.
        name:
          type: string
        profilePictureUrl:
          type: string
          maxLength: 4095
        password:
          type: string
        phoneNumber:
          type: string
        provider:
          type: string
          default: local
          enum:
          - local
          - saml
          - google
          - github
          - facebook
          - microsoft
          - scim2
          - slack
          - apple
        metadata:
          type: string
          description: Stringified JSON object
          example: '{}'
        skipInviteEmail:
          type: boolean
        roleIds:
          type: array
          items:
            type: string
        emailMetadata:
          type: object
        expirationInSeconds:
          type: number
          minimum: 300
          description: Temporary user expiration in seconds
    SelfEmailUpdateRequestDto:
      type: object
      properties:
        email:
          type: string
          description: The email to update to
      required:
      - email
    FronteggPaginationMetadata:
      type: object
      properties:
        totalItems:
          type: number
        totalPages:
          type: number
      required:
      - totalItems
