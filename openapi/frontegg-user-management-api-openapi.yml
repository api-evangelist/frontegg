      type: object
      properties:
        email:
          type: string
      required:
      - email
    CreateUserEmailVendorRequestDto:
      type: object
      properties:
        email:
          type: string
          description: New email
        isVerified:
          type: boolean
          description: Is user email verified
      required:
      - email
    UserDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        profilePictureUrl:
          type: string
        sub:
          type: string
        verified:
          type: boolean
        mfaEnrolled:
          type: boolean
        mfaBypass:
          type: boolean
        phoneNumber:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleResponse'
        permissions:
