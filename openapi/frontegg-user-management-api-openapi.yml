      description: Frontegg sub-domain for use with user tokens
      variables:
        domain:
          default: app-xxx
    get:
      operationId: UsersControllerV1_searchUsers
      summary: Get Users with Fuzzy Search
      description: 'Retrieve all users for a specific account (tenant) or for the entire environment.


        In addition to all standard Get users query parameters, this route supports phrase search, enabling complex queries with options such as `contains`, `excludes`, `optional`, and approximate matching.'
      parameters:
      - name: _limit
        required: false
        in: query
        description: The default limit is 50 users per request, the maximum is 200
        schema:
          type: number
      - name: _identifier
        required: false
        in: query
        description: Filter users by username prefix match. Must be provided together with _identifierType
        schema:
          type: string
      - name: _identifierType
        required: false
        in: query
        description: Filter users by username. Must be provided together with _identifier
        schema:
          enum:
          - email
          - phoneNumber
          - username
          type: string
      - name: _includeSubTenants
        required: false
        in: query
        description: when passing a user id, gives the option to include or not include sub accounts (tenants) when searching users
        schema:
          default: true
          type: boolean
      - name: _namePrefix
        required: false
        in: query
        description: Filter users by prefix name match
        schema:
          type: string
      - name: _phraseSearchContains
        required: false
        in: query
        description: Pass a list of strings, separated by comma, to search for users that contain all of the strings in the list
        schema:
          type: array
          items:
            type: string
      - name: _phraseSearchExcludes
        required: false
        in: query
        description: Pass a list of strings, separated by comma, to search for users that do not contain any of the strings in the list
        schema:
          type: array
          items:
            type: string
      - name: _phraseSearchOptional
        required: false
        in: query
        description: Pass a list of strings, separated by comma, to search for users that contain at least one of the strings in the list
        schema:
          type: array
          items:
            type: string
      - name: _phraseSearchApproximate
        required: false
        in: query
        description: When true, the search will be approximate (fuzzy), meaning it will include similar characters to the ones in the search string
        schema:
          default: false
          type: boolean
      - name: _offset
        required: false
        in: query
        schema:
          minimum: 0
          type: number
        description: The page number to retrieve. For example, use 0 for the first page, 1 for the second page.
      - name: _email
        required: false
        in: query
        schema:
          type: string
      - name: _tenantId
        required: false
        in: query
        schema:
          type: string
      - name: ids
        required: false
        in: query
        schema:
          type: string
      - name: _sortBy
        required: false
        in: query
        schema:
          enum:
          - createdAt
          - name
          - email
          - id
          - verified
          - isLocked
          - provider
          - tenantId
          type: string
      - name: _order
        required: false
        in: query
        schema:
          enum:
          - ASC
          - DESC
          type: string
      - name: _externalIds
        required: false
        in: query
        schema:
          type: string
      - name: frontegg-tenant-id
        in: header
        description: The account (tenant) ID identifier
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/FronteggPaginationWrapper'
                - properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/UserV3Dto'
                    _links:
                      $ref: '#/components/schemas/FronteggPaginationLinks'
                    _metadata:
                      $ref: '#/components/schemas/FronteggPaginationMetadata'
      tags:
      - User Management
      security:
      - bearer: []
