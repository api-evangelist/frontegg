    - url: https://api.ca.frontegg.com/identity
      description: CA Region
    - url: https://api.au.frontegg.com/identity
      description: AU Region
    - url: https://{domain}.frontegg.com/identity
      description: Frontegg sub-domain for use with user tokens
      variables:
        domain:
          default: app-xxx
    post:
      operationId: UsersTenantsControllerV1_enableUserTenant
      summary: Enable User Account (tenant)
      description: 'Enable a disabled user for an account (tenant).


        An enabled user can log in and use the system.


        Provide the user''s ID as a path parameter.'
      parameters:
      - name: userId
        required: true
        in: path
        schema:
          type: string
      - name: frontegg-tenant-id
        in: header
        description: The tenant identifier. Required for requests to api.frontegg.com (or your region) when using a management token. Parsed from the token when using user or API tokens
        required: false
        schema:
          type: string
      responses:
        '200':
          description: ''
        '201':
          description: ''
        '403':
          description: ''
      tags:
      - User Management
      security:
      - bearer: []
