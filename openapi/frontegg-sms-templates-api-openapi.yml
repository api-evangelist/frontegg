tags:
- name: SMS templates
  x-displayName: SMS templates
paths:
  /resources/configurations/v1/sms/templates:
    get:
      operationId: VendorSmsController_getAllSmsTemplates
      summary: Gets vendor SMS templates
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTemplateResponse'
      tags:
      - SMS templates
      security:
      - bearer: []
  /resources/configurations/v1/sms/templates/{type}:
    get:
      operationId: VendorSmsController_getSmsTemplate
      summary: Gets vendor SMS template by type
      parameters:
      - name: type
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTemplateResponse'
      tags:
      - SMS templates
      security:
      - bearer: []
    delete:
      operationId: VendorSmsController_deleteSmsTemplate
      summary: Deletes vendor SMS template by type
      parameters:
      - name: type
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - SMS templates
      security:
      - bearer: []
    post:
      operationId: VendorSmsController_createSmsTemplate
      summary: Create or update a vendor SMS template
      parameters:
      - name: type
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSmsTemplateRequest'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTemplateResponse'
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTemplateResponse'
      tags:
      - SMS templates
      security:
      - bearer: []
  /resources/configurations/v1/sms/templates/{type}/default:
    get:
      operationId: VendorSmsController_getSmsDefaultTemplate
      summary: Gets vendor default SMS template by type
      parameters:
      - name: type
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsTemplateResponse'
      tags:
      - SMS templates
      security:
      - bearer: []
components:
  schemas:
    SmsTemplateResponse:
      type: object
      properties: {}
    CreateSmsTemplateRequest:
      type: object
      properties: {}
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
